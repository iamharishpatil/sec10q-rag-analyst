[project]
name = "sec10q-rag-analyst"
version = "0.1.0"
description = "Open-source SEC 10-Q retrieval-augmented analyst with citations."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
explore = [
    "pandas>=2.0",
    "rich>=13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
